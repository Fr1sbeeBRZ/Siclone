spring.application.name=Siclone

# ============================================================
# Base de datos
# ------------------------------------------------------------
# En local, la conexión la aporta Docker Compose Support a partir
# de compose.yaml (no hace falta spring.datasource.*). En otros
# entornos se configura con SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
# ============================================================
# El esquema lo gestiona Flyway; Hibernate solo comprueba que las
# entidades coinciden con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migraciones en src/main/resources/db/migration (V1__..., V2__...)
spring.flyway.locations=classpath:db/migration

# ============================================================
# Seguridad: Keycloak (OIDC) como emisor de los JWT
# ------------------------------------------------------------
# La configuración del emisor se descarga la primera vez que llega
# una petición con token, así que la aplicación arranca aunque
# Keycloak todavía no esté levantado.
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/siclone}

# ============================================================
# Almacenamiento de documentos (MinIO / S3)
# ------------------------------------------------------------
# Propiedades propias de la aplicación: se enlazarán a una clase
# @ConfigurationProperties cuando exista el módulo "documento".
# ============================================================
siclone.almacenamiento.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
siclone.almacenamiento.access-key=${MINIO_ACCESS_KEY:minioadmin}
siclone.almacenamiento.secret-key=${MINIO_SECRET_KEY:minioadmin}
siclone.almacenamiento.bucket=${MINIO_BUCKET:siclone-documentos}

# ============================================================
# Comunicaciones por email (SMTP)
# ============================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.default-encoding=UTF-8
# Si el servidor pide autenticación: SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD
# Todavía no hay servidor SMTP en compose.yaml: sin esto el health
# check de /actuator/health saldría DOWN. Quitar al añadirlo.
management.health.mail.enabled=false

# ============================================================
# Observabilidad (OpenTelemetry -> Grafana LGTM)
# ------------------------------------------------------------
# En local, los endpoints OTLP de logs, métricas y trazas los aporta
# Docker Compose Support a partir del contenedor grafana/otel-lgtm.
# En otros entornos se configuran con las variables estándar
# OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_SERVICE_NAME, etc.
# Los logs se envían con el appender de logback-spring.xml.
# ============================================================
# Muestrear todas las trazas (en producción conviene bajarlo).
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,metrics,modulith
