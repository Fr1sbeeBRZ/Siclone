services:

  grafana-lgtm:
    image: 'grafana/otel-lgtm:0.33.1'  # misma versión que en TestcontainersConfiguration
    ports:
      - '3000:3000'   # Grafana (interfaz web) - usuario/contraseña: admin/admin
      - '4317:4317'   # OTLP gRPC  (entrada de logs, métricas y trazas)
      - '4318:4318'   # OTLP HTTP  (entrada de logs, métricas y trazas)
    volumes:
      - lgtm-data:/data   # conserva datos y dashboards entre reinicios

  postgres:
    image: 'postgres:18'  # versión fija (misma que en TestcontainersConfiguration): 'latest' puede cambiar de versión mayor sin avisar
    environment:
      POSTGRES_DB: siclone
      POSTGRES_USER: siclone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'   # puerto fijo para conectarte con DBeaver, IntelliJ, psql...
    volumes:
      # Datos persistentes. En Postgres 18+ se monta /var/lib/postgresql (ya no .../data)
      - postgres-data:/var/lib/postgresql
      # Scripts que se ejecutan SOLO la primera vez (cuando el volumen está vacío)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siclone -d siclone']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  lgtm-data:
